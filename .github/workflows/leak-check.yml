# Reusable: fail a change that adds private context to a public repository.
# Callers: `uses: Matronhq/.github/.github/workflows/leak-check.yml@main`
# with `secrets: { LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }} }`, triggered by
# `pull_request_target` (so fork pull requests get the patterns too) and
# `push`. The pull request's code is only read as data (git diff), never run:
# the checker comes from this repository.
name: leak-check
on:
  workflow_call:
    secrets:
      LEAK_PATTERNS:
        required: true
permissions:
  contents: read
jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # A pull request's head (forks included) is refs/pull/N/head in the
          # base repository; a push checks out what was pushed.
          ref: ${{ github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          # Safe here: the checked-out files are only read with git diff and
          # matched against the patterns. Nothing from the pull request is
          # executed, the token is read-only and not persisted, and the
          # checker itself comes from this repository.
          allow-unsafe-pr-checkout: true
      - uses: actions/checkout@v7
        with:
          repository: Matronhq/.github
          path: .leak-check
          persist-credentials: false
          sparse-checkout: scripts/leak_check.py
          sparse-checkout-cone-mode: false
      - name: Check for private context
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: python3 .leak-check/scripts/leak_check.py
